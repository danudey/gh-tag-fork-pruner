version: "2"

linters:
  default: standard
  enable:
    # Correctness
    - errcheck        # an unchecked error return
    - errorlint       # %v where %w was meant, and vice versa
    - nilerr          # `return nil` after checking err != nil
    - bodyclose       # an HTTP response body never closed
    - contextcheck    # a function that should take a context and does not
    - noctx           # an HTTP request built without one
    - copyloopvar
    - exhaustive      # a switch over an enum missing a case
    - makezero
    # Security
    - gosec           # Bandit's Go equivalent; no separate job needed
    # Style
    - revive
    - staticcheck
    - unconvert
    - unparam
    - misspell
    - godot
    - goconst
    - gocritic
  settings:
    errcheck:
      # Not checking the error from these is idiomatic rather than a bug.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        # Writing to stdout/stderr. A failed write to a closed terminal is
        # not something this program can do anything useful about, and
        # checking every one of them would bury the errors that matter.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    exhaustive:
      default-signifies-exhaustive: true
    revive:
      rules:
        - name: exported
          arguments: [checkPrivateReceivers, disableStutteringCheck]
    gosec:
      excludes:
        # Weak random is fine outside cryptography; flag it per-line instead.
        - G404
  # In golangci-lint v2 the exclusion rules live under `linters`, not at the
  # top level. A top-level `exclusions:` block is silently ignored.
  exclusions:
    rules:
      # Test files legitimately do things production code should not.
      - path: _test\.go
        linters: [errcheck, gosec, goconst, dupl, unparam]

formatters:
  enable:
    - gofumpt
    - goimports

issues:
  # Report everything, not just what a pull request touched. A repository that
  # only ever lints the diff never gets clean.
  new: false
  # No cap. The defaults (50 issues, 3 per linter) silently hide the rest.
  max-issues-per-linter: 0
  max-same-issues: 0
  # The default keeps one issue per line, so silencing one linter makes a
  # second one appear on the same line as if it were new. Report both.
  uniq-by-line: false
